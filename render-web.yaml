# Optional alternative to render.yaml. Deploy either this file OR render.yaml, never both.
services:
  - type: web
    name: dharma-post-ai-service
    runtime: python
    buildCommand: "pip install ."
    startCommand: "python -m dharma_post_ai serve"
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_GRAPH_API_VERSION
        value: v26.0
      - key: TIMEZONE
        value: Asia/Phnom_Penh
      - key: POST_TIME
        value: "07:00"
      - key: AUTO_PUBLISH
        value: "true"
      - key: REQUIRE_APPROVAL
        value: "false"
      - key: MAX_DAILY_POSTS
        value: "1"
      - key: FONT_PATH
        value: Battambang-Bold.ttf
      - key: PORT
        value: "8080"
