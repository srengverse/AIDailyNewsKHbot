<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Daily News KH - Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.1) 0px, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
        }
        .khmer-font { font-family: 'Battambang', serif; }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-card {
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
            50% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.5); }
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-6">

    <!-- Top Bar -->
    <div class="max-w-7xl mx-auto mb-8 flex justify-between items-center glass rounded-2xl p-4">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                <i data-lucide="bot" class="text-white w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">AI News Bot 🇰🇭</h1>
                <p class="text-xs text-slate-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    System Online
                </p>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <span id="last-update" class="text-xs text-slate-500 font-mono">Updating...</span>
            <button onclick="triggerRun()" id="run-btn" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-medium transition-all active:scale-95 shadow-lg shadow-blue-500/20">
                <i data-lucide="zap" class="w-4 h-4"></i>
                <span>Force Check</span>
            </button>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <!-- Total Posted -->
        <div class="glass rounded-2xl p-6 stat-card">
            <div class="flex justify-between items-start mb-4">
                <div class="p-2 bg-blue-500/20 rounded-lg text-blue-400">
                    <i data-lucide="newspaper" class="w-5 h-5"></i>
                </div>
                <span class="text-xs text-slate-400 bg-slate-800/50 px-2 py-1 rounded-md">Today</span>
            </div>
            <h3 class="text-3xl font-bold text-white mb-1" id="total-today">--</h3>
            <p class="text-sm text-slate-400">Articles Posted Today</p>
        </div>

        <!-- Success Rate -->
        <div class="glass rounded-2xl p-6 stat-card">
            <div class="flex justify-between items-start mb-4">
                <div class="p-2 bg-emerald-500/20 rounded-lg text-emerald-400">
                    <i data-lucide="activity" class="w-5 h-5"></i>
                </div>
                <span class="text-xs text-slate-400 bg-slate-800/50 px-2 py-1 rounded-md">Health</span>
            </div>
            <h3 class="text-3xl font-bold text-white mb-1" id="success-rate">--%</h3>
            <p class="text-sm text-slate-400">Success Rate</p>
        </div>

        <!-- Groq Usage -->
        <div class="glass rounded-2xl p-6 stat-card">
            <div class="flex justify-between items-start mb-4">
                <div class="p-2 bg-orange-500/20 rounded-lg text-orange-400">
                    <i data-lucide="cpu" class="w-5 h-5"></i>
                </div>
                <span class="text-xs text-slate-400 bg-slate-800/50 px-2 py-1 rounded-md">Groq</span>
            </div>
            <h3 class="text-3xl font-bold text-white mb-1" id="groq-usage">--</h3>
            <p class="text-sm text-slate-400">Tokens Today</p>
        </div>

        <!-- Facebook Usage -->
        <div class="glass rounded-2xl p-6 stat-card">
            <div class="flex justify-between items-start mb-4">
                <div class="p-2 bg-indigo-500/20 rounded-lg text-indigo-400">
                    <i data-lucide="facebook" class="w-5 h-5"></i>
                </div>
                <span class="text-xs text-slate-400 bg-slate-800/50 px-2 py-1 rounded-md">API</span>
            </div>
            <h3 class="text-3xl font-bold text-white mb-1" id="fb-usage">--</h3>
            <p class="text-sm text-slate-400">API Calls</p>
        </div>
    </div>

    <!-- Main Content Split -->
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Live Feed -->
        <div class="lg:col-span-2 glass rounded-2xl p-6 min-h-[500px]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="radio" class="w-5 h-5 text-red-500 animate-pulse"></i>
                    Live Feed
                </h2>
                <span class="text-xs text-slate-500">Real-time</span>
            </div>
            
            <div class="space-y-4" id="feed-container">
                <!-- Items will be injected here -->
                <div class="animate-pulse flex space-x-4">
                    <div class="rounded-lg bg-slate-700 h-16 w-16"></div>
                    <div class="flex-1 space-y-2 py-1">
                        <div class="h-2 bg-slate-700 rounded w-3/4"></div>
                        <div class="h-2 bg-slate-700 rounded w-1/2"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- System Status -->
        <div class="glass rounded-2xl p-6 h-fit">
            <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                <i data-lucide="server" class="w-5 h-5 text-slate-400"></i>
                System Status
            </h2>
            
            <div class="space-y-6">
                <!-- Deployment -->
                <div>
                    <div class="flex justify-between text-sm mb-2">
                        <span class="text-slate-400">Environment</span>
                        <span class="text-emerald-400 font-medium">Production (Render)</span>
                    </div>
                    <div class="w-full bg-slate-700 rounded-full h-1.5">
                        <div class="bg-emerald-500 h-1.5 rounded-full" style="width: 100%"></div>
                    </div>
                </div>

                <!-- API Limits -->
                <div>
                    <div class="flex justify-between text-sm mb-2">
                        <span class="text-slate-400">Groq Daily Limit</span>
                        <span class="text-orange-400 font-medium" id="groq-percent">--%</span>
                    </div>
                    <div class="w-full bg-slate-700 rounded-full h-1.5">
                        <div class="bg-orange-500 h-1.5 rounded-full" id="groq-bar" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Gemini Keys -->
                <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-purple-500/20 rounded-lg">
                            <i data-lucide="key" class="w-4 h-4 text-purple-400"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium">Gemini Switcher</p>
                            <p class="text-xs text-slate-400">7 Keys active • Auto-rotation on</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Format Date
        const timeAgo = (dateStr) => {
            const date = new Date(dateStr);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            if (seconds < 60) return "Just now";
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            return date.toLocaleDateString();
        };

        // Trigger Run
        async function triggerRun() {
            const btn = document.getElementById('run-btn');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Running...`;
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            lucide.createIcons();

            try {
                const res = await fetch('/api/trigger', { method: 'POST' });
                if (res.ok) {
                    setTimeout(() => {
                        btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Started`;
                        btn.classList.replace('bg-blue-600', 'bg-green-600');
                        lucide.createIcons();
                        
                        setTimeout(() => {
                            btn.innerHTML = originalHTML;
                            btn.disabled = false;
                            btn.classList.remove('opacity-75', 'cursor-not-allowed', 'bg-green-600');
                            btn.classList.add('bg-blue-600');
                            lucide.createIcons();
                        }, 2000);
                    }, 500);
                }
            } catch (e) {
                console.error(e);
                btn.innerHTML = `<i data-lucide="x" class="w-4 h-4"></i> Error`;
                btn.classList.replace('bg-blue-600', 'bg-red-600');
                lucide.createIcons();
            }
        }

        // Fetch Stats
        async function updateStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                // Update Counters
                document.getElementById('total-today').innerText = data.total_today;
                
                // Success Rate
                const rate = data.total_today > 0 
                    ? Math.round((data.success_count / data.total_today) * 100) 
                    : 100;
                document.getElementById('success-rate').innerText = `${rate}%`;
                
                // API Usage
                const groq = data.rate_limits.groq?.last_day || 0;
                document.getElementById('groq-usage').innerText = groq.toLocaleString();
                document.getElementById('fb-usage').innerText = (data.rate_limits.facebook?.last_day || 0).toLocaleString();

                // Groq Bar
                const groqLimit = 14400; // Approx daily limit
                const groqPercent = Math.min((groq / groqLimit) * 100, 100).toFixed(1);
                document.getElementById('groq-percent').innerText = `${groqPercent}%`;
                document.getElementById('groq-bar').style.width = `${groqPercent}%`;

                // Feed
                const feed = document.getElementById('feed-container');
                if (data.recent_posts && data.recent_posts.length > 0) {
                    feed.innerHTML = data.recent_posts.map(post => {
                        const isSuccess = post.facebook === true;
                        const statusColor = isSuccess ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-red-500/10 text-red-400 border-red-500/20';
                        const statusIcon = isSuccess ? 'check-circle' : 'x-circle';
                        
                        return `
                        <div class="flex items-center gap-4 p-4 rounded-xl border border-slate-700/50 bg-slate-800/30 hover:bg-slate-800/50 transition-colors">
                            <div class="flex-shrink-0">
                                <span class="w-10 h-10 rounded-full flex items-center justify-center ${statusColor}">
                                    <i data-lucide="${statusIcon}" class="w-5 h-5"></i>
                                </span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium text-white truncate khmer-font">
                                    ${post.title || 'Untitled Post'}
                                </p>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-xs text-slate-400 flex items-center gap-1">
                                        <i data-lucide="rss" class="w-3 h-3"></i> ${post.source || 'Unknown'}
                                    </span>
                                    <span class="text-slate-600">•</span>
                                    <span class="text-xs text-slate-500">${timeAgo(post.posted_at)}</span>
                                </div>
                            </div>
                            <a href="#" class="p-2 hover:bg-slate-700 rounded-lg text-slate-400 transition-colors">
                            <i data-lucide="external-link" class="w-4 h-4"></i>
                            </a>
                        </div>
                        `;
                    }).join('');
                    lucide.createIcons();
                } else {
                    feed.innerHTML = `<div class="text-center py-12 text-slate-500">No posts yet today</div>`;
                }

                // Update Time
                document.getElementById('last-update').innerText = 'Updated: ' + new Date().toLocaleTimeString();

            } catch (e) {
                console.error("Stats fetch error:", e);
            }
        }

        // Init
        updateStats();
        setInterval(updateStats, 5000); // 5s poll
    </script>
</body>
</html>
