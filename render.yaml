services:
  - type: web
    name: cambodia-news-bot
    runtime: python
    region: singapore
    plan: free
    
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    
    envVars:
      # Python version
      - key: PYTHON_VERSION
        value: 3.11
      
      # Gemini AI (REQUIRED)
      - key: GEMINI_API_KEY
        sync: false
      
      # Telegram (REQUIRED)
      - key: ENABLE_TELEGRAM
        value: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      
      # Twitter (Optional)
      - key: ENABLE_TWITTER
        value: true
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_SECRET
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: TWITTER_DAILY_LIMIT
        value: 15
      - key: TWITTER_RESERVE_SLOTS
        value: 3
      - key: TWITTER_COOLDOWN_MINUTES
        value: 30
      
      # Firebase (REQUIRED)
      - key: FIREBASE_CREDENTIALS
        sync: false
      
      # Advanced Features
      - key: CONTENT_QUALITY_THRESHOLD
        value: 60
      - key: ENABLE_AI_DUPLICATE_CHECK
        value: true
      - key: ENABLE_IMAGE_OPTIMIZATION
        value: true
      
      # Optional
      - key: WEBSITE_LINK
        value: ""
    
    healthCheckPath: /health
    autoDeploy: true