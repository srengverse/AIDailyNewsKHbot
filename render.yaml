services:
  - type: web
    name: khmer-news-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      GEMINI_API_KEY:
        fromDatabase:
          name: gemini-key
          property: value
      TELEGRAM_BOT_TOKEN: 
        sync: false
      TELEGRAM_CHANNEL_ID: 
        sync: false