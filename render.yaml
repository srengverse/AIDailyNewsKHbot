services:
  - type: web
    name: cambodia-news-bot
    runtime: python
    region: singapore
    plan: free
    
    # Build & Start
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python botnews.py
    
    envVars:
      # --- Core Configuration ---
      - key: PYTHON_VERSION
        value: 3.12.0

      # --- AI Credentials ---
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # --- Facebook Publishing ---
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false

      # --- Database ---
      - key: FIREBASE_CREDENTIALS
        sync: false

    # Health Check (botnews.py uses /health)
    healthCheckPath: /health
    autoDeploy: true