[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dharma-post-ai"
version = "1.0.0"
description = "Generate Khmer Dharma reflections with Gemini, render posters, store records in Supabase, and publish to a Facebook Page."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DharmaPostAI Contributors"}]
dependencies = [
  "aiohttp>=3.11,<4.0",
  "APScheduler>=3.10,<4.0",
  "google-genai>=1.0,<2.0",
  "Pillow>=10.0,<13.0",
  "python-dotenv>=1.0,<2.0",
  "supabase>=2.10,<3.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.0"]

[project.scripts]
dharma-post-ai = "dharma_post_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
